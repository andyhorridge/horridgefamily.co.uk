<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Horridge Family Tree</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    body {
      text-align: center;
    }

    header {
      padding: 30px 20px 20px;
    }

    h1 {
      margin: 0 0 25px;
      font-size: clamp(32px, 7vw, 58px);
    }

    .family-photo {
      display: block;
      width: min(90%, 850px);
      height: auto;
      margin: 0 auto;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .caption {
      margin-top: 14px;
      color: #666;
      font-size: 16px;
    }

    .tree-section {
      padding: 10px 10px 40px;
    }

    .tree-section h2 {
      font-size: clamp(26px, 5vw, 42px);
      margin-bottom: 10px;
    }

    .instructions {
      color: #666;
      margin: 0 0 18px;
      font-size: 15px;
    }

    #status {
      margin: 15px auto;
      font-weight: bold;
      color: #555;
    }

    #tree {
      width: 100%;
      height: 75vh;
      min-height: 600px;
      background: white;
      border-radius: 16px;
      border: 1px solid #ddd;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 600px) {

      header {
        padding: 22px 12px 15px;
      }

      .tree-section {
        padding-left: 5px;
        padding-right: 5px;
      }

      #tree {
        height: 72vh;
        min-height: 550px;
        border-radius: 12px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>Horridge Family Tree</h1>

  <img
    src="2023-05-06.JPG"
    alt="Horridge family photo"
    class="family-photo"
  >

  <p class="caption">
    Family photo from 6th May 2023
  </p>

</header>


<section class="tree-section">

  <h2>Explore the Family Tree</h2>

  <p class="instructions">
    Tap a person to explore their branch. Pinch to zoom and drag to move around.
  </p>

  <div id="status">
    Loading family tree…
  </div>

  <div id="tree"></div>

</section>


<script src="OrgChart.js"></script>


<script>

async function startFamilyTree() {

  const status = document.getElementById("status");
  const treeElement = document.getElementById("tree");

  try {

    /*
      First make sure the OrgChart library has loaded.
    */

    if (typeof OrgChart === "undefined") {

      throw new Error(
        "OrgChart.js could not be loaded."
      );

    }


    /*
      Load your actual family data.
    */

    const response = await fetch(
      "tree-data.json?v=" + Date.now()
    );


    if (!response.ok) {

      throw new Error(
        "tree-data.json could not be loaded."
      );

    }


    const familyData = await response.json();


    if (
      !Array.isArray(familyData) ||
      familyData.length === 0
    ) {

      throw new Error(
        "The family tree data is empty."
      );

    }


    /*
      OrgChart uses one parent ID for its tree layout.

      Your GEDCOM conversion contains:
      pid = father
      mid = mother

      For the visual hierarchy we use the father where
      available, otherwise the mother.

      The original mother relationship remains in
      tree-data.json for later improvements.
    */

    const nodes = familyData.map(person => {

      const node = {
        id: person.id,
        name: person.name || "Unknown"
      };


      if (person.pid && person.pid !== person.id) {

        node.pid = person.pid;

      }

      else if (person.mid && person.mid !== person.id) {

        node.pid = person.mid;

      }


      return node;

    });


    /*
      Build interactive tree.
    */

    const chart = new OrgChart(
      treeElement,
      {

        nodes: nodes,

        nodeBinding: {
          field_0: "name"
        },

        enableSearch: true,

        enableDragDrop: false,

        mouseScrool: OrgChart.action.zoom,

        scaleInitial: 0.7

      }
    );


    status.textContent =
      familyData.length +
      " family members loaded";


    /*
      Hide status after a moment.
    */

    setTimeout(() => {

      status.style.display = "none";

    }, 2500);


  }

  catch (error) {

    console.error(error);

    status.style.color = "#c00";

    status.textContent =
      "Error loading family tree: " +
      error.message;

  }

}


window.addEventListener(
  "DOMContentLoaded",
  startFamilyTree
);

</script>


</body>

</html>
