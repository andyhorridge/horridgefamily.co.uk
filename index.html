<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Horridge Family Tree</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f6f6f6;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  color: #222;
}

header {
  text-align: center;
  padding: 30px 15px 15px;
}

h1 {
  margin: 0 0 25px;
  font-size: clamp(34px, 7vw, 58px);
}

.family-photo {
  width: min(90%, 800px);
  height: auto;
  display: block;
  margin: auto;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.caption {
  color: #666;
  margin-top: 12px;
}

main {
  max-width: 1600px;
  margin: auto;
  padding: 20px 10px 50px;
}

h2 {
  text-align: center;
  font-size: clamp(28px, 5vw, 44px);
  margin-bottom: 8px;
}

.intro {
  text-align: center;
  color: #666;
  margin: 0 auto 22px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

#search {
  width: min(420px, 95%);
  padding: 13px 15px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 10px;
}

button {
  border: 0;
  background: #222;
  color: white;
  padding: 12px 17px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

#status {
  text-align: center;
  margin: 12px 0;
  color: #666;
}


/* SEARCH RESULTS */

#results {
  max-width: 650px;
  margin: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
  overflow: hidden;
  display: none;
}

.search-result {
  padding: 13px 15px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  text-align: left;
}

.search-result:hover {
  background: #f2f2f2;
}


/* TREE AREA */

#treeArea {
  width: 100%;
  overflow-x: auto;
  padding: 30px 10px 80px;
}

.tree-inner {
  min-width: 850px;
  text-align: center;
}


/* PERSON CARDS */

.person-card {
  display: inline-flex;
  min-width: 165px;
  max-width: 220px;
  min-height: 62px;
  align-items: center;
  justify-content: center;
  padding: 10px 14px;
  background: white;
  border: 2px solid #aaa;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
  position: relative;
  transition:
    transform .15s,
    box-shadow .15s;
}

.person-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0,0,0,.13);
}

.person-card.focus {
  border-color: #222;
  border-width: 3px;
  background: #f4f4f4;
}

.person-card.unknown {
  color: #888;
  border-style: dashed;
}


/* TITLES */

.generation-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
  margin: 10px 0 18px;
}


/* PARENTS */

.parents {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 28px;
  position: relative;
  margin-bottom: 55px;
}

.parents::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -30px;
  height: 30px;
  border-left: 2px solid #888;
}

.parents::before {
  content: "";
  position: absolute;
  top: 31px;
  left: calc(50% - 100px);
  right: calc(50% - 100px);
  border-top: 2px solid #888;
}


/* CURRENT PERSON + PARTNER */

.current-family {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 26px;
  position: relative;
  margin-bottom: 45px;
}

.partner-line {
  width: 55px;
  border-top: 3px solid #666;
}


/* CHILDREN */

.children-section {
  position: relative;
  padding-top: 35px;
}

.children-section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 35px;
  border-left: 2px solid #888;
}

.children-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 35px;
  position: relative;
  padding-top: 30px;
}

.children-row::before {
  content: "";
  position: absolute;
  top: 0;
  left: 8%;
  right: 8%;
  border-top: 2px solid #888;
}

.child-branch {
  position: relative;
}

.child-branch::before {
  content: "";
  position: absolute;
  top: -30px;
  left: 50%;
  height: 30px;
  border-left: 2px solid #888;
}


/* GRANDCHILDREN */

.descendants {
  margin-top: 20px;
}

.descendant-row {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-top: 25px;
  position: relative;
}

.small-card {
  min-width: 130px;
  max-width: 175px;
  min-height: 52px;
  font-size: 13px;
}


/* NAVIGATION */

.tree-nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}

.focus-label {
  text-align: center;
  margin: 5px 0 25px;
  font-size: 17px;
  color: #555;
}


/* MOBILE */

@media (max-width: 700px) {

  header {
    padding: 24px 10px 10px;
  }

  main {
    padding-left: 5px;
    padding-right: 5px;
  }

  #treeArea {
    padding-left: 0;
    padding-right: 0;
  }

  .tree-inner {
    min-width: 760px;
  }

  .person-card {
    min-width: 145px;
    max-width: 180px;
    font-size: 14px;
  }

  .parents {
    gap: 24px;
  }

  .children-row {
    gap: 22px;
  }

}

</style>

</head>


<body>


<header>

<h1>Horridge Family Tree</h1>

<img
  src="2023-05-06.JPG"
  alt="Horridge Family"
  class="family-photo"
>

<p class="caption">
Family photo from 6th May 2023
</p>

</header>


<main>

<h2>Explore the Family Tree</h2>

<p class="intro">
Search for a family member or tap any name to explore their family.
</p>


<div class="controls">

<input
  id="search"
  type="search"
  placeholder="Search family member..."
>

<button id="homeButton">
Andrew
</button>

</div>


<div id="results"></div>

<div id="status">
Loading family tree…
</div>


<div class="tree-nav">

<button id="backButton">
← Back
</button>

</div>


<div
  id="focusLabel"
  class="focus-label"
></div>


<div id="treeArea">

<div
  id="tree"
  class="tree-inner"
></div>

</div>


</main>


<script>

let people = [];
let peopleMap = new Map();
let currentPersonId = 1;
let historyStack = [];


/* ----------------------------------
   KNOWN PARTNER LINKS

   Andrew = 1
   Sarah = 4
---------------------------------- */

const knownPartners = {
  1: [4],
  4: [1]
};


/* ----------------------------------
   LOAD DATA
---------------------------------- */

async function loadFamilyTree() {

  const status =
    document.getElementById("status");

  try {

    const response =
      await fetch(
        "tree-data.json?v=" +
        Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "tree-data.json could not be loaded"
      );

    }

    people =
      await response.json();


    people.forEach(person => {

      person.id =
        Number(person.id);

      if (person.pid) {
        person.pid =
          Number(person.pid);
      }

      if (person.mid) {
        person.mid =
          Number(person.mid);
      }

      peopleMap.set(
        person.id,
        person
      );

    });


    status.textContent =
      people.length +
      " family members loaded";


    setTimeout(() => {

      status.style.display =
        "none";

    }, 1800);


    showPerson(1, false);

  }

  catch(error) {

    status.style.color =
      "red";

    status.textContent =
      "Error loading tree: " +
      error.message;

  }

}


/* ----------------------------------
   GET PERSON
---------------------------------- */

function getPerson(id) {

  if (!id) return null;

  return peopleMap.get(
    Number(id)
  ) || null;

}


/* ----------------------------------
   FIND CHILDREN
---------------------------------- */

function getChildren(personId) {

  return people.filter(person =>

    person.pid === personId ||

    person.mid === personId

  );

}


/* ----------------------------------
   FIND PARTNERS
---------------------------------- */

function getPartners(personId) {

  const partnerIds =
    new Set();


  /* Known explicit partners */

  if (
    knownPartners[personId]
  ) {

    knownPartners[personId]
      .forEach(id => {

        partnerIds.add(id);

      });

  }


  /* Also infer from shared children */

  const children =
    getChildren(personId);


  children.forEach(child => {

    if (
      child.pid === personId &&
      child.mid &&
      child.mid !== personId
    ) {

      partnerIds.add(
        child.mid
      );

    }

    if (
      child.mid === personId &&
      child.pid &&
      child.pid !== personId
    ) {

      partnerIds.add(
        child.pid
      );

    }

  });


  return Array.from(
    partnerIds
  )
  .map(id =>
    getPerson(id)
  )
  .filter(Boolean);

}


/* ----------------------------------
   PERSON CARD
---------------------------------- */

function createCard(
  person,
  focus = false,
  small = false
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "person-card";


  if (focus) {

    card.classList.add(
      "focus"
    );

  }


  if (small) {

    card.classList.add(
      "small-card"
    );

  }


  if (!person) {

    card.classList.add(
      "unknown"
    );

    card.textContent =
      "Unknown";

    return card;

  }


  card.textContent =
    person.name ||
    "Unknown";


  card.onclick = () => {

    if (
      person.id !==
      currentPersonId
    ) {

      showPerson(
        person.id,
        true
      );

    }

  };


  return card;

}


/* ----------------------------------
   DISPLAY PERSON
---------------------------------- */

function showPerson(
  personId,
  addHistory = true
) {

  const person =
    getPerson(personId);

  if (!person) return;


  if (
    addHistory &&
    currentPersonId &&
    currentPersonId !== personId
  ) {

    historyStack.push(
      currentPersonId
    );

  }


  currentPersonId =
    personId;


  document.getElementById(
    "focusLabel"
  ).textContent =
    "Viewing " +
    person.name;


  const tree =
    document.getElementById(
      "tree"
    );


  tree.innerHTML = "";


/* ----------------------------------
   PARENTS
---------------------------------- */

  const parentTitle =
    document.createElement(
      "div"
    );

  parentTitle.className =
    "generation-title";

  parentTitle.textContent =
    "Parents";

  tree.appendChild(
    parentTitle
  );


  const parents =
    document.createElement(
      "div"
    );

  parents.className =
    "parents";


  const father =
    getPerson(
      person.pid
    );

  const mother =
    getPerson(
      person.mid
    );


  parents.appendChild(
    createCard(father)
  );

  parents.appendChild(
    createCard(mother)
  );


  tree.appendChild(
    parents
  );


/* ----------------------------------
   PERSON + PARTNER
---------------------------------- */

  const currentTitle =
    document.createElement(
      "div"
    );

  currentTitle.className =
    "generation-title";

  currentTitle.textContent =
    "Family";

  tree.appendChild(
    currentTitle
  );


  const familyRow =
    document.createElement(
      "div"
    );

  familyRow.className =
    "current-family";


  familyRow.appendChild(
    createCard(
      person,
      true
    )
  );


  const partners =
    getPartners(
      person.id
    );


  partners.forEach(
    partner => {

      const line =
        document.createElement(
          "div"
        );

      line.className =
        "partner-line";

      familyRow.appendChild(
        line
      );

      familyRow.appendChild(
        createCard(
          partner
        )
      );

    }
  );


  tree.appendChild(
    familyRow
  );


/* ----------------------------------
   CHILDREN
---------------------------------- */

  const children =
    getChildren(
      person.id
    );


  if (children.length) {

    const childTitle =
      document.createElement(
        "div"
      );

    childTitle.className =
      "generation-title";

    childTitle.textContent =
      "Children";

    tree.appendChild(
      childTitle
    );


    const section =
      document.createElement(
        "div"
      );

    section.className =
      "children-section";


    const row =
      document.createElement(
        "div"
      );

    row.className =
      "children-row";


    children.forEach(
      child => {

        const branch =
          document.createElement(
            "div"
          );

        branch.className =
          "child-branch";


        branch.appendChild(
          createCard(
            child
          )
        );


        const grandchildren =
          getChildren(
            child.id
          );


        if (
          grandchildren.length
        ) {

          const descendant =
            document.createElement(
              "div"
            );

          descendant.className =
            "descendants";


          const descendantRow =
            document.createElement(
              "div"
            );

          descendantRow.className =
            "descendant-row";


          grandchildren
            .slice(0, 5)
            .forEach(
              grandchild => {

                descendantRow
                  .appendChild(
                    createCard(
                      grandchild,
                      false,
                      true
                    )
                  );

              }
            );


          descendant.appendChild(
            descendantRow
          );

          branch.appendChild(
            descendant
          );

        }


        row.appendChild(
          branch
        );

      }
    );


    section.appendChild(
      row
    );

    tree.appendChild(
      section
    );

  }

  else {

    const noChildren =
      document.createElement(
        "div"
      );

    noChildren.className =
      "generation-title";

    noChildren.textContent =
      "No children recorded";

    tree.appendChild(
      noChildren
    );

  }


  document
    .getElementById(
      "treeArea"
    )
    .scrollTo({
      left: 0,
      behavior: "smooth"
    });

}


/* ----------------------------------
   SEARCH
---------------------------------- */

const searchBox =
  document.getElementById(
    "search"
  );

const resultsBox =
  document.getElementById(
    "results"
  );


searchBox.addEventListener(
  "input",
  () => {

    const value =
      searchBox.value
        .trim()
        .toLowerCase();


    resultsBox.innerHTML =
      "";


    if (!value) {

      resultsBox.style.display =
        "none";

      return;

    }


    const matches =
      people
      .filter(person =>

        person.name
          .toLowerCase()
          .includes(value)

      )
      .slice(0, 15);


    matches.forEach(
      person => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "search-result";

        item.textContent =
          person.name;


        item.onclick =
          () => {

            searchBox.value =
              "";

            resultsBox.style.display =
              "none";

            showPerson(
              person.id,
              true
            );

          };


        resultsBox.appendChild(
          item
        );

      }
    );


    resultsBox.style.display =
      matches.length
      ? "block"
      : "none";

  }
);


/* ----------------------------------
   BACK
---------------------------------- */

document
  .getElementById(
    "backButton"
  )
  .onclick = () => {

    if (!historyStack.length) {
      return;
    }

    const previous =
      historyStack.pop();

    showPerson(
      previous,
      false
    );

  };


/* ----------------------------------
   HOME
---------------------------------- */

document
  .getElementById(
    "homeButton"
  )
  .onclick = () => {

    historyStack = [];

    showPerson(
      1,
      false
    );

  };


loadFamilyTree();

</script>


</body>

</html>
