<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Horridge Family Tree</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #222;
}

header {
  text-align: center;
  padding: 35px 20px 20px;
}

h1 {
  font-size: clamp(36px, 7vw, 62px);
  margin: 0 0 30px;
}

.family-photo {
  display: block;
  width: min(90%, 850px);
  height: auto;
  margin: auto;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
}

.caption {
  color: #666;
  margin-top: 14px;
}

.tree-section {
  padding: 20px;
  max-width: 1400px;
  margin: auto;
}

.tree-section h2 {
  text-align: center;
  font-size: clamp(30px, 5vw, 48px);
  margin-bottom: 8px;
}

.instructions {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.controls input {
  width: min(100%, 400px);
  padding: 13px 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.controls button {
  border: 0;
  background: #222;
  color: white;
  padding: 12px 17px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

#status {
  text-align: center;
  font-weight: 600;
  margin: 20px;
}

#tree {
  background: white;
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 25px;
  min-height: 500px;
  overflow: auto;
}


/* TREE */

.family-tree,
.family-tree ul {
  list-style: none;
  margin: 0;
  padding-left: 28px;
  position: relative;
}

.family-tree {
  padding-left: 0;
}

.family-tree ul::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 12px;
  border-left: 2px solid #ccc;
}

.family-tree li {
  position: relative;
  padding: 7px 0 7px 18px;
}

.family-tree li::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 25px;
  width: 28px;
  border-top: 2px solid #ccc;
}

.family-tree > li::before {
  display: none;
}

.person {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-height: 42px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 9px 13px;
  font-weight: 600;
  box-shadow: 0 2px 7px rgba(0,0,0,.06);
  cursor: pointer;
  user-select: none;
}

.person:hover {
  background: #f2f2f2;
}

.toggle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #222;
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}

.no-children .toggle {
  visibility: hidden;
}

.children.collapsed {
  display: none;
}

.highlight > .person {
  background: #fff3a6;
  border-color: #d3ad00;
}

.branch-title {
  margin: 30px 0 12px;
  font-size: 20px;
  font-weight: 700;
  color: #555;
}

@media (max-width: 650px) {

  header {
    padding: 25px 12px 15px;
  }

  .tree-section {
    padding: 10px;
  }

  #tree {
    padding: 14px 8px;
    border-radius: 12px;
  }

  .family-tree,
  .family-tree ul {
    padding-left: 19px;
  }

  .person {
    font-size: 14px;
    padding: 8px 10px;
  }

}

</style>

</head>


<body>


<header>

  <h1>Horridge Family Tree</h1>

  <img
    class="family-photo"
    src="2023-05-06.JPG"
    alt="Horridge Family"
  >

  <p class="caption">
    Family photo from 6th May 2023
  </p>

</header>


<section class="tree-section">

  <h2>Explore the Family Tree</h2>

  <p class="instructions">
    Tap a name to open or close that family branch.
  </p>


  <div class="controls">

    <input
      type="search"
      id="search"
      placeholder="Search family member..."
    >

    <button id="expandAll">
      Expand all
    </button>

    <button id="collapseAll">
      Collapse all
    </button>

  </div>


  <div id="status">
    Loading family tree…
  </div>


  <div id="tree"></div>

</section>


<script>

const treeContainer = document.getElementById("tree");
const statusBox = document.getElementById("status");


async function loadTree() {

  try {

    const response = await fetch(
      "tree-data.json?v=" + Date.now()
    );

    if (!response.ok) {
      throw new Error(
        "Could not load tree-data.json"
      );
    }

    const people = await response.json();

    if (!Array.isArray(people)) {
      throw new Error(
        "tree-data.json is not valid family data"
      );
    }


    const peopleById = new Map();

    people.forEach(person => {

      peopleById.set(
        Number(person.id),
        {
          ...person,
          id: Number(person.id),
          children: []
        }
      );

    });


    /*
      Build the visible tree.

      We use father (pid) as the main tree parent.
      If father isn't known, we use mother (mid).

      This keeps every individual in a clean,
      expandable hierarchy.
    */

    peopleById.forEach(person => {

      let parentId = null;

      if (
        person.pid &&
        Number(person.pid) !== person.id &&
        peopleById.has(Number(person.pid))
      ) {

        parentId = Number(person.pid);

      }

      else if (
        person.mid &&
        Number(person.mid) !== person.id &&
        peopleById.has(Number(person.mid))
      ) {

        parentId = Number(person.mid);

      }


      if (parentId) {

        peopleById
          .get(parentId)
          .children
          .push(person);

      }

    });


    /*
      Find top-level ancestors.
    */

    const childIds = new Set();

    peopleById.forEach(person => {

      person.children.forEach(child => {
        childIds.add(child.id);
      });

    });


    const roots = [];

    peopleById.forEach(person => {

      if (!childIds.has(person.id)) {
        roots.push(person);
      }

    });


    roots.sort((a,b) =>
      a.name.localeCompare(b.name)
    );


    treeContainer.innerHTML = "";


    const mainList =
      document.createElement("ul");

    mainList.className =
      "family-tree";


    roots.forEach(root => {

      mainList.appendChild(
        buildPerson(root, 0)
      );

    });


    treeContainer.appendChild(mainList);


    statusBox.textContent =
      people.length +
      " family members loaded";

    setTimeout(() => {
      statusBox.style.display = "none";
    }, 2500);


    /*
      Start with deeper branches collapsed.
    */

    document
      .querySelectorAll(
        ".family-tree ul"
      )
      .forEach((ul, index) => {

        if (index > 6) {

          ul.classList.add(
            "collapsed"
          );

          const parent =
            ul.previousElementSibling;

          if (parent) {

            const toggle =
              parent.querySelector(
                ".toggle"
              );

            if (toggle) {
              toggle.textContent = "+";
            }

          }

        }

      });


  }

  catch (error) {

    console.error(error);

    statusBox.style.color = "red";

    statusBox.textContent =
      "Error loading family tree: " +
      error.message;

  }

}



function buildPerson(person, depth) {

  const li =
    document.createElement("li");

  li.dataset.name =
    person.name.toLowerCase();


  const card =
    document.createElement("div");

  card.className = "person";


  const toggle =
    document.createElement("span");

  toggle.className = "toggle";


  if (person.children.length) {

    toggle.textContent = "−";

  }
  else {

    li.classList.add(
      "no-children"
    );

  }


  const name =
    document.createElement("span");

  name.textContent =
    person.name || "Unknown";


  card.appendChild(toggle);
  card.appendChild(name);

  li.appendChild(card);


  if (person.children.length) {

    const children =
      document.createElement("ul");

    children.className =
      "children";


    person.children
      .sort((a,b) =>
        a.name.localeCompare(b.name)
      )
      .forEach(child => {

        children.appendChild(
          buildPerson(
            child,
            depth + 1
          )
        );

      });


    li.appendChild(children);


    card.addEventListener(
      "click",
      () => {

        children.classList.toggle(
          "collapsed"
        );

        toggle.textContent =
          children.classList.contains(
            "collapsed"
          )
          ? "+"
          : "−";

      }
    );

  }


  return li;

}



/*
  Expand everything
*/

document
  .getElementById("expandAll")
  .addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".children"
        )
        .forEach(item => {

          item.classList.remove(
            "collapsed"
          );

        });


      document
        .querySelectorAll(
          ".toggle"
        )
        .forEach(toggle => {

          if (
            toggle
              .closest("li")
              .querySelector(
                ":scope > .children"
              )
          ) {

            toggle.textContent =
              "−";

          }

        });

    }
  );



/*
  Collapse everything
*/

document
  .getElementById("collapseAll")
  .addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".children"
        )
        .forEach(item => {

          item.classList.add(
            "collapsed"
          );

        });


      document
        .querySelectorAll(
          ".toggle"
        )
        .forEach(toggle => {

          if (
            toggle
              .closest("li")
              .querySelector(
                ":scope > .children"
              )
          ) {

            toggle.textContent =
              "+";

          }

        });

    }
  );



/*
  Search
*/

document
  .getElementById("search")
  .addEventListener(
    "input",
    event => {

      const value =
        event.target.value
          .toLowerCase()
          .trim();


      document
        .querySelectorAll(
          ".family-tree li"
        )
        .forEach(li => {

          li.classList.remove(
            "highlight"
          );

        });


      if (!value) {
        return;
      }


      const matches =
        Array.from(
          document.querySelectorAll(
            ".family-tree li"
          )
        )
        .filter(li =>
          li.dataset.name &&
          li.dataset.name.includes(
            value
          )
        );


      matches.forEach(li => {

        li.classList.add(
          "highlight"
        );


        let parent = li.parentElement;

        while (
          parent &&
          parent !== treeContainer
        ) {

          if (
            parent.classList &&
            parent.classList.contains(
              "children"
            )
          ) {

            parent.classList.remove(
              "collapsed"
            );

          }

          parent =
            parent.parentElement;

        }

      });


      if (matches.length) {

        matches[0]
          .scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

      }

    }
  );


loadTree();

</script>


</body>

</html>
