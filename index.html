<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Horridge Family Tree</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f6f6f6;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  color: #222;
}

body {
  text-align: center;
}

header {
  padding: 30px 15px 15px;
}

h1 {
  margin: 0 0 25px;
  font-size: clamp(34px, 7vw, 58px);
}

.family-photo {
  width: min(90%, 800px);
  height: auto;
  display: block;
  margin: auto;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.caption {
  color: #666;
  margin-top: 12px;
}

.version {
  margin-top: 8px;
  color: #999;
  font-size: 13px;
}

main {
  max-width: 1500px;
  margin: auto;
  padding: 20px 10px 60px;
}

h2 {
  font-size: clamp(28px, 5vw, 44px);
  margin-bottom: 8px;
}

.intro {
  color: #666;
  margin: 0 auto 22px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

#search {
  width: min(460px, 92%);
  padding: 13px 15px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 10px;
}

button {
  border: 0;
  background: #222;
  color: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#status {
  margin: 12px 0;
  color: #666;
}

#results {
  max-width: 650px;
  margin: 0 auto 20px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  overflow: hidden;
  display: none;
  text-align: left;
}

.search-result {
  padding: 13px 15px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.search-result:hover {
  background: #f2f2f2;
}

.tree-nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 14px;
}

#focusLabel {
  color: #555;
  margin-bottom: 24px;
  font-size: 17px;
}

#treeArea {
  overflow-x: auto;
  padding: 20px 0 60px;
}

#tree {
  min-width: 820px;
  margin: auto;
}


/* TITLES */

.generation-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #888;
  margin: 10px 0 20px;
}


/* CARDS */

.person-card {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 170px;
  max-width: 240px;
  min-height: 66px;

  padding: 11px 15px;

  background: white;
  border: 2px solid #aaa;
  border-radius: 12px;

  box-shadow: 0 3px 10px rgba(0,0,0,.08);

  font-size: 15px;
  font-weight: 650;

  cursor: pointer;
}

.person-card.focus {
  border: 3px solid #222;
  background: #f1f1f1;
}

.person-card.unknown {
  color: #999;
  border-style: dashed;
}

.person-card:hover {
  background: #f7f7f7;
}


/* PARENTS */

.parents-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  margin-bottom: 60px;
}

.parents-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

.parent-spouse-line {
  width: 45px;
  border-top: 3px solid #777;
}

.parents-wrap::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -35px;
  height: 35px;
  border-left: 2px solid #888;
}


/* CURRENT FAMILY */

.family-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 55px;
  position: relative;
}

.family-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

.partner-line {
  width: 55px;
  border-top: 3px solid #555;
}

.family-wrap.has-children::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -35px;
  height: 35px;
  border-left: 2px solid #888;
}


/* CHILDREN */

.children-wrap {
  position: relative;
  padding-top: 30px;
}

.children-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 32px;
  position: relative;
}

.children-row::before {
  content: "";
  position: absolute;
  top: 0;
  left: 8%;
  right: 8%;
  border-top: 2px solid #888;
}

.child-branch {
  position: relative;
  padding-top: 28px;
}

.child-branch::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 28px;
  border-left: 2px solid #888;
}

.no-children {
  color: #888;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 20px;
}


/* MOBILE */

@media (max-width: 700px) {

  header {
    padding: 22px 10px 12px;
  }

  main {
    padding-left: 5px;
    padding-right: 5px;
  }

  #tree {
    min-width: 740px;
  }

  .person-card {
    min-width: 145px;
    max-width: 190px;
    font-size: 14px;
  }

  .children-row {
    gap: 20px;
  }

}

</style>

</head>


<body>


<header>

  <h1>Horridge Family Tree</h1>

  <img
    src="2023-05-06.JPG"
    alt="Horridge Family"
    class="family-photo"
  >

  <p class="caption">
    Family photo from 6th May 2023
  </p>

  <div class="version">
    Tree version 5
  </div>

</header>


<main>

  <h2>Explore the Family Tree</h2>

  <p class="intro">
    Search for a family member or tap any name to explore their family.
  </p>


  <div class="controls">

    <input
      id="search"
      type="search"
      placeholder="Search family member..."
    >

    <button id="homeButton">
      Andrew
    </button>

  </div>


  <div id="results"></div>

  <div id="status">
    Loading family tree…
  </div>


  <div class="tree-nav">

    <button id="backButton">
      ← Back
    </button>

  </div>


  <div id="focusLabel"></div>


  <div id="treeArea">

    <div id="tree"></div>

  </div>


</main>


<script>

let people = [];

let peopleMap = new Map();

let currentPersonId = 1;

let historyStack = [];


/* --------------------------------
   LOAD DATA
-------------------------------- */

async function loadTree() {

  const status =
    document.getElementById("status");

  try {

    const response =
      await fetch(
        "tree-data.json?v=5"
      );

    if (!response.ok) {

      throw new Error(
        "Could not load tree-data.json"
      );

    }

    people =
      await response.json();


    people.forEach(person => {

      person.id =
        Number(person.id);

      if (person.father) {
        person.father =
          Number(person.father);
      }

      if (person.mother) {
        person.mother =
          Number(person.mother);
      }

      if (!Array.isArray(person.partners)) {
        person.partners = [];
      }

      if (!Array.isArray(person.children)) {
        person.children = [];
      }

      person.partners =
        person.partners.map(Number);

      person.children =
        person.children.map(Number);


      peopleMap.set(
        person.id,
        person
      );

    });


    status.textContent =
      people.length +
      " family members loaded";


    setTimeout(() => {

      status.style.display =
        "none";

    }, 1500);


    showPerson(
      1,
      false
    );

  }

  catch(error) {

    status.style.color =
      "red";

    status.textContent =
      "Error: " +
      error.message;

  }

}


/* --------------------------------
   GET PERSON
-------------------------------- */

function getPerson(id) {

  if (!id) {
    return null;
  }

  return peopleMap.get(
    Number(id)
  ) || null;

}


/* --------------------------------
   GET CHILDREN
-------------------------------- */

function getChildren(personId) {

  const person =
    getPerson(personId);

  if (
    !person ||
    !Array.isArray(person.children)
  ) {

    return [];

  }

  return person.children
    .map(id => getPerson(id))
    .filter(Boolean);

}


/* --------------------------------
   GET PARTNERS
-------------------------------- */

function getPartners(personId) {

  const person =
    getPerson(personId);

  if (
    !person ||
    !Array.isArray(person.partners)
  ) {

    return [];

  }

  return person.partners
    .map(id => getPerson(id))
    .filter(Boolean);

}


/* --------------------------------
   CREATE PERSON CARD
-------------------------------- */

function createCard(
  person,
  focus = false
) {

  const card =
    document.createElement("div");

  card.className =
    "person-card";


  if (focus) {

    card.classList.add(
      "focus"
    );

  }


  if (!person) {

    card.classList.add(
      "unknown"
    );

    card.textContent =
      "Unknown";

    return card;

  }


  card.textContent =
    person.name || "Unknown";


  card.addEventListener(
    "click",
    () => {

      if (
        person.id !==
        currentPersonId
      ) {

        showPerson(
          person.id,
          true
        );

      }

    }
  );


  return card;

}


/* --------------------------------
   SHOW PERSON
-------------------------------- */

function showPerson(
  personId,
  addHistory = true
) {

  const person =
    getPerson(personId);

  if (!person) {
    return;
  }


  if (
    addHistory &&
    currentPersonId &&
    currentPersonId !== personId
  ) {

    historyStack.push(
      currentPersonId
    );

  }


  currentPersonId =
    personId;


  document.getElementById(
    "focusLabel"
  ).textContent =
    "Viewing " +
    person.name;


  const tree =
    document.getElementById(
      "tree"
    );

  tree.innerHTML = "";


/* ================================
   PARENTS
================================ */

  const parentTitle =
    document.createElement("div");

  parentTitle.className =
    "generation-title";

  parentTitle.textContent =
    "Parents";

  tree.appendChild(
    parentTitle
  );


  const parentsWrap =
    document.createElement("div");

  parentsWrap.className =
    "parents-wrap";


  const parentsRow =
    document.createElement("div");

  parentsRow.className =
    "parents-row";


  const father =
    getPerson(
      person.father
    );

  const mother =
    getPerson(
      person.mother
    );


  parentsRow.appendChild(
    createCard(father)
  );


  const parentLine =
    document.createElement("div");

  parentLine.className =
    "parent-spouse-line";

  parentsRow.appendChild(
    parentLine
  );


  parentsRow.appendChild(
    createCard(mother)
  );


  parentsWrap.appendChild(
    parentsRow
  );

  tree.appendChild(
    parentsWrap
  );


/* ================================
   CURRENT PERSON + PARTNERS
================================ */

  const familyTitle =
    document.createElement("div");

  familyTitle.className =
    "generation-title";

  familyTitle.textContent =
    "Family";

  tree.appendChild(
    familyTitle
  );


  const familyWrap =
    document.createElement("div");

  familyWrap.className =
    "family-wrap";


  const familyRow =
    document.createElement("div");

  familyRow.className =
    "family-row";


  familyRow.appendChild(
    createCard(
      person,
      true
    )
  );


  const partners =
    getPartners(
      person.id
    );


  partners.forEach(
    partner => {

      const partnerLine =
        document.createElement("div");

      partnerLine.className =
        "partner-line";

      familyRow.appendChild(
        partnerLine
      );

      familyRow.appendChild(
        createCard(partner)
      );

    }
  );


  familyWrap.appendChild(
    familyRow
  );


  const children =
    getChildren(
      person.id
    );


  if (children.length) {

    familyWrap.classList.add(
      "has-children"
    );

  }


  tree.appendChild(
    familyWrap
  );


/* ================================
   CHILDREN
================================ */

  if (children.length) {

    const childTitle =
      document.createElement("div");

    childTitle.className =
      "generation-title";

    childTitle.textContent =
      "Children";

    tree.appendChild(
      childTitle
    );


    const childrenWrap =
      document.createElement("div");

    childrenWrap.className =
      "children-wrap";


    const childrenRow =
      document.createElement("div");

    childrenRow.className =
      "children-row";


    children.forEach(
      child => {

        const branch =
          document.createElement("div");

        branch.className =
          "child-branch";


        branch.appendChild(
          createCard(child)
        );


        childrenRow.appendChild(
          branch
        );

      }
    );


    childrenWrap.appendChild(
      childrenRow
    );


    tree.appendChild(
      childrenWrap
    );

  }

  else {

    const noChildren =
      document.createElement("div");

    noChildren.className =
      "no-children";

    noChildren.textContent =
      "No children recorded";

    tree.appendChild(
      noChildren
    );

  }


  document.getElementById(
    "treeArea"
  ).scrollTo({
    left: 0,
    behavior: "smooth"
  });

}


/* --------------------------------
   SEARCH
-------------------------------- */

const searchBox =
  document.getElementById(
    "search"
  );

const resultsBox =
  document.getElementById(
    "results"
  );


searchBox.addEventListener(
  "input",
  () => {

    const value =
      searchBox.value
        .trim()
        .toLowerCase();


    resultsBox.innerHTML =
      "";


    if (!value) {

      resultsBox.style.display =
        "none";

      return;

    }


    const matches =
      people.filter(
        person =>

          person.name
            .toLowerCase()
            .includes(value)

      )
      .slice(
        0,
        15
      );


    matches.forEach(
      person => {

        const result =
          document.createElement("div");

        result.className =
          "search-result";

        result.textContent =
          person.name;


        result.addEventListener(
          "click",
          () => {

            searchBox.value =
              "";

            resultsBox.style.display =
              "none";

            showPerson(
              person.id,
              true
            );

          }
        );


        resultsBox.appendChild(
          result
        );

      }
    );


    resultsBox.style.display =
      matches.length
      ? "block"
      : "none";

  }
);


/* --------------------------------
   HOME BUTTON
-------------------------------- */

document.getElementById(
  "homeButton"
).addEventListener(
  "click",
  () => {

    historyStack = [];

    showPerson(
      1,
      false
    );

  }
);


/* --------------------------------
   BACK BUTTON
-------------------------------- */

document.getElementById(
  "backButton"
).addEventListener(
  "click",
  () => {

    if (
      historyStack.length === 0
    ) {

      return;

    }

    const previous =
      historyStack.pop();


    showPerson(
      previous,
      false
    );

  }
);


/* --------------------------------
   START
-------------------------------- */

loadTree();

</script>


</body>

</html>
